<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="google-site-verification"
      content="HJ3uuOpqTshJgL8yTaZMTs8veAeB0P78dJ_b7VvQTWg">

<title>Private Vault</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#08090d;
  --card:#11131a;
  --card2:#181b24;
  --text:#f5f7fb;
  --muted:#9299a8;
  --border:#272b36;
  --accent:#7c5cff;
  --accent2:#9b83ff;
  --danger:#ff4d67;
  --success:#35d07f;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
  --bg:#f3f5f9;
  --card:#ffffff;
  --card2:#eef0f5;
  --text:#11131a;
  --muted:#697080;
  --border:#dfe3eb;
  --shadow:0 20px 50px rgba(30,40,70,.12);
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(124,92,255,.13),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,180,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  transition:.25s;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth-wrap{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:420px;
  background:rgba(17,19,26,.92);
  border:1px solid var(--border);
  border-radius:28px;
  padding:30px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  animation:fadeUp .5s ease;
}

body.light .auth-card{
  background:rgba(255,255,255,.94);
}

.logo{
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:linear-gradient(135deg,var(--accent),#4f8cff);
  font-size:28px;
  margin-bottom:18px;
  box-shadow:0 12px 35px rgba(124,92,255,.35);
}

h1{
  font-size:28px;
  margin-bottom:7px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:25px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.search-box,
.album-select{
  width:100%;
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 14px;
  outline:none;
  transition:.2s;
}

.field input:focus,
.search-box:focus,
.album-select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.12);
}

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  color:white;
  background:linear-gradient(135deg,var(--accent),#5d82ff);
  font-weight:700;
  margin-top:4px;
  transition:.2s;
}

.primary-btn:active{
  transform:scale(.98);
}

.secondary-btn{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
  padding:11px 14px;
  border-radius:12px;
}

.auth-switch{
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.link-btn{
  color:var(--accent2);
  background:none;
  font-weight:700;
}

.message{
  min-height:20px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

/* APP */

.app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:rgba(8,9,13,.82);
  backdrop-filter:blur(18px);
}

body.light .topbar{
  background:rgba(255,255,255,.82);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#4f8cff);
}

.brand-title{
  font-weight:800;
}

.brand-email{
  color:var(--muted);
  font-size:11px;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:39px;
  height:39px;
  border-radius:12px;
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--text);
}

.container{
  width:min(1200px,100%);
  margin:auto;
  padding:22px 16px 80px;
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-end;
  margin-bottom:20px;
}

.hero h2{
  font-size:27px;
}

.hero p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.upload-btn{
  background:linear-gradient(135deg,var(--accent),#5d82ff);
  color:#fff;
  padding:13px 17px;
  border-radius:14px;
  font-weight:800;
  white-space:nowrap;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:9px;
  margin-bottom:15px;
}

.search-wrap{
  position:relative;
}

.search-box{
  padding-left:40px;
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.toolbar select{
  min-width:125px;
}

.stats{
  display:flex;
  gap:9px;
  overflow:auto;
  margin-bottom:17px;
  scrollbar-width:none;
}

.stat{
  min-width:135px;
  padding:13px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
}

.stat-value{
  font-weight:800;
  font-size:18px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

/* ALBUMS */

.album-bar{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:4px;
  margin-bottom:18px;
  scrollbar-width:none;
}

.album-chip{
  white-space:nowrap;
  padding:9px 13px;
  border-radius:999px;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border);
}

.album-chip.active{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
}

/* GRID */

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.photo{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:17px;
  background:var(--card2);
  border:1px solid var(--border);
  animation:fadeIn .35s ease;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.3s;
}

.photo:hover img{
  transform:scale(1.04);
}

.photo-actions{
  position:absolute;
  right:7px;
  top:7px;
  display:flex;
  gap:5px;
}

.photo-actions button{
  width:32px;
  height:32px;
  border-radius:10px;
  color:#fff;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(7px);
}

.empty{
  padding:70px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:45px;
  margin-bottom:12px;
}

/* PROFILE */

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-top:20px;
}

.panel-title{
  font-weight:800;
  margin-bottom:14px;
}

.profile-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.profile-row:last-child{
  border-bottom:0;
}

.profile-label{
  color:var(--muted);
  font-size:13px;
}

.profile-value{
  font-size:13px;
  text-align:right;
  max-width:65%;
  word-break:break-all;
}

/* UPLOAD STATUS */

.upload-list{
  margin-top:15px;
}

.upload-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  background:var(--card2);
  border-radius:12px;
  margin-bottom:7px;
}

.upload-name{
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

.upload-status{
  color:var(--muted);
  font-size:12px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(12px);
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.modal-head h3{
  font-size:20px;
}

.viewer{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.96);
  display:none;
  flex-direction:column;
}

.viewer.show{
  display:flex;
}

.viewer-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
}

.viewer-title{
  color:#fff;
  max-width:65%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.viewer-actions{
  display:flex;
  gap:7px;
}

.viewer-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:rgba(255,255,255,.1);
  color:#fff;
}

.viewer-body{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  touch-action:none;
}

.viewer-body img{
  max-width:95%;
  max-height:85%;
  object-fit:contain;
  transition:transform .15s;
  transform-origin:center;
}

/* TOAST */

.toast-container{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:500;
  display:flex;
  flex-direction:column;
  gap:8px;
  max-width:calc(100% - 30px);
}

.toast{
  background:#171922;
  color:#fff;
  border:1px solid #303441;
  border-radius:13px;
  padding:12px 15px;
  box-shadow:var(--shadow);
  animation:toastIn .25s ease;
  font-size:13px;
}

/* FOOTER */

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:45px;
}

/* ANIMATIONS */

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}

@keyframes toastIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* MOBILE */

@media(max-width:750px){
  .gallery{
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }

  .search-wrap{
    grid-column:1/-1;
  }

  .hero{
    align-items:center;
  }

  .hero h2{
    font-size:23px;
  }

  .hero p{
    font-size:12px;
  }

  .upload-btn{
    padding:11px 13px;
  }
}

@media(max-width:430px){
  .auth-card{
    padding:23px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .brand-email{
    max-width:105px;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .toolbar select{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-wrap">

  <!-- LOGIN -->

  <div id="loginBox" class="auth-card">

    <div class="logo">🔐</div>

    <h1>Private Vault</h1>

    <p class="subtitle">
      Your private photo storage.
    </p>

    <div class="field">
      <label>Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email">
    </div>

    <div class="field">
      <label>Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password">
    </div>

    <button class="primary-btn" onclick="login()">
      Unlock Vault
    </button>

    <div id="message" class="message"></div>

    <div class="auth-switch">
      New here?
      <button class="link-btn" onclick="showSignup()">
        Create New Account
      </button>
    </div>

  </div>


  <!-- SIGNUP -->

  <div id="signupBox" class="auth-card hidden">

    <div class="logo">✨</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your private vault.
    </p>

    <div class="field">
      <label>Email</label>
      <input
        id="signupEmail"
        type="email"
        autocomplete="email"
        placeholder="Enter your email">
    </div>

    <div class="field">
      <label>Password</label>
      <input
        id="signupPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Minimum 6 characters">
    </div>

    <button class="primary-btn" onclick="signup()">
      Create Account
    </button>

    <div id="signupMessage" class="message"></div>

    <div class="auth-switch">
      Already have an account?
      <button class="link-btn" onclick="showLogin()">
        Back to Login
      </button>
    </div>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

  <header class="topbar">

    <div class="brand">
      <div class="brand-icon">🔐</div>

      <div>
        <div class="brand-title">Private Vault</div>
        <div id="userEmail" class="brand-email"></div>
      </div>
    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        title="Theme"
        onclick="toggleTheme()">
        🌓
      </button>

      <button
        class="icon-btn"
        title="Profile"
        onclick="openProfile()">
        👤
      </button>

      <button
        class="icon-btn"
        title="Logout"
        onclick="logout()">
        🚪
      </button>

    </div>

  </header>


  <main class="container">

    <section class="hero">

      <div>
        <h2>My Photos</h2>
        <p>Your private gallery</p>
      </div>

      <button
        class="upload-btn"
        onclick="document.getElementById('fileInput').click()">
        ＋ Upload
      </button>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        multiple
        hidden
        onchange="uploadPhotos(event)">

    </section>


    <!-- STATS -->

    <section class="stats">

      <div class="stat">
        <div id="photoCount" class="stat-value">0</div>
        <div class="stat-label">Photos</div>
      </div>

      <div class="stat">
        <div id="storageUsed" class="stat-value">0 MB</div>
        <div class="stat-label">Storage Used</div>
      </div>

      <div class="stat">
        <div id="albumCount" class="stat-value">0</div>
        <div class="stat-label">Albums</div>
      </div>

    </section>


    <!-- SEARCH / SORT -->

    <section class="toolbar">

      <div class="search-wrap">
        <span class="search-icon">🔍</span>

        <input
          id="searchInput"
          class="search-box"
          type="search"
          placeholder="Search photos..."

      </div>

      <select
        id="sortSelect"
        class="album-select"
        onchange="renderGallery()">

        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>

        <option value="za">Z → A</option>

      </select>

      <button
        class="secondary-btn"
        onclick="loadEverything()">
        ↻ Refresh
      </button>

    </section>


    <!-- ALBUMS -->

    <section id="albumBar" class="album-bar"></section>


    <!-- GALLERY -->

    <section id="gallery" class="gallery"></section>


    <!-- UPLOAD STATUS -->

    <section
      id="uploadList"
      class="upload-list">
    </section>


    <!-- PROFILE -->

    <section
      id="profilePanel"
      class="panel hidden">

      <div class="panel-title">
        Account
      </div>

      <div class="profile-row">
        <div class="profile-label">Email</div>
        <div
          id="profileEmail"
          class="profile-value">
        </div>
      </div>

      <div class="profile-row">
        <div class="profile-label">User ID</div>
        <div
          id="profileId"
          class="profile-value">
        </div>
      </div>

      <div class="profile-row">
        <div class="profile-label">Photos</div>
        <div
          id="profilePhotos"
          class="profile-value">
        </div>
      </div>

      <div class="profile-row">
        <div class="profile-label">Storage</div>
        <div
          id="profileStorage"
          class="profile-value">
        </div>
      </div>

      <button
        class="secondary-btn"
        style="margin-top:15px;width:100%"
        onclick="logout()">
        Logout
      </button>

    </section>


    <footer>
      Page created by Prince
    </footer>

  </main>

</div>


<!-- ================= ALBUM MODAL ================= -->

<div id="albumModal" class="modal">

  <div class="modal-card">

    <div class="modal-head">

      <h3>Albums</h3>

      <button
        class="icon-btn"
        onclick="closeAlbumModal()">
        ✕
      </button>

    </div>

    <div class="field">

      <label>New album name</label>

      <input
        id="albumName"
        placeholder="e.g. Family, Travel...">

    </div>

    <button
      class="primary-btn"
      onclick="createAlbum()">
      Create Album
    </button>

    <div
      id="albumModalList"
      style="margin-top:15px">
    </div>

  </div>

</div>


<!-- ================= VIEWER ================= -->

<div id="viewer" class="viewer">

  <div class="viewer-top">

    <div
      id="viewerTitle"
      class="viewer-title">
    </div>

    <div class="viewer-actions">

      <button
        class="viewer-btn"
        onclick="zoomOut()">
        −
      </button>

      <button
        class="viewer-btn"
        onclick="resetZoom()">
        1×
      </button>

      <button
        class="viewer-btn"
        onclick="zoomIn()">
        ＋
      </button>

      <button
        class="viewer-btn"
        onclick="downloadCurrent()">
        ↓
      </button>

      <button
        class="viewer-btn"
        onclick="closeViewer()">
        ✕
      </button>

    </div>

  </div>

  <div
    id="viewerBody"
    class="viewer-body">

    <img
      id="viewerImage"
      src=""
      alt="Photo">

  </div>

</div>


<!-- ================= TOAST ================= -->

<div
  id="toastContainer"
  class="toast-container">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://woyvvkyckiwougcqvgno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_GiAZ68Ta1ypJwyqxi_m3GA_lnVUVK5W";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser = null;

let photos = [];

let albums = [];

let activeAlbum = "all";

let currentViewerPhoto = null;

let zoomLevel = 1;

let inactivityTimer = null;

const AUTO_LOGOUT_MS = 30 * 60 * 1000;


/* =====================================================
   HELPERS
===================================================== */

function toast(message){

  const container =
    document.getElementById("toastContainer");

  const item =
    document.createElement("div");

  item.className = "toast";

  item.textContent = message;

  container.appendChild(item);

  setTimeout(() => {
    item.remove();
  }, 3000);
}


function formatBytes(bytes){

  if (!bytes || bytes <= 0){
    return "0 MB";
  }

  const mb =
    bytes / (1024 * 1024);

  if (mb < 1024){
    return mb.toFixed(1) + " MB";
  }

  return (mb / 1024).toFixed(2) + " GB";
}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =====================================================
   AUTH UI
===================================================== */

function showSignup(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("signupBox")
    .classList.remove("hidden");

  document
    .getElementById("signupMessage")
    .textContent = "";
}


function showLogin(){

  document
    .getElementById("signupBox")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("message")
    .textContent = "";
}


/* =====================================================
   SIGN UP
===================================================== */

async function signup(){

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const message =
    document
      .getElementById("signupMessage");

  if (!email || !password){

    message.textContent =
      "Enter email and password.";

    return;
  }

  if (password.length < 6){

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }

  message.textContent =
    "Creating account...";

  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if (error){

    message.textContent =
      error.message;

    return;
  }

  if (data.session){

    currentUser =
      data.session.user;

    await enterApp();

  }else{

    message.textContent =
      "Account created. Check your email if verification is required.";

    toast("Account created");

  }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document
      .getElementById("message");

  if (!email || !password){

    message.textContent =
      "Enter email and password.";

    return;
  }

  message.textContent =
    "Unlocking...";

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });

  if (error){

    message.textContent =
      error.message;

    return;
  }

  currentUser =
    data.user;

  await enterApp();
}


/* =====================================================
   ENTER APP
===================================================== */

async function enterApp(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .textContent =
      currentUser.email || "";

  document
    .getElementById("profileEmail")
    .textContent =
      currentUser.email || "";

  document
    .getElementById("profileId")
    .textContent =
      currentUser.id;

  resetInactivityTimer();

  await loadEverything();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  photos = [];

  albums = [];

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authScreen")
    .classList.remove("hidden");

  document
    .getElementById("profilePanel")
    .classList.add("hidden");

  toast("Logged out");

  showLogin();
}


/* =====================================================
   SESSION CHECK
===================================================== */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();

  if (data.session){

    currentUser =
      data.session.user;

    await enterApp();

  }
}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadEverything(){

  if (!currentUser){
    return;
  }

  await Promise.all([
    loadAlbums(),
    loadPhotos()
  ]);

  updateStats();
}


/* =====================================================
   LOAD ALBUMS
===================================================== */

async function loadAlbums(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("albums")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending:false
      });

  if (error){

    console.error(error);

    return;
  }

  albums = data || [];

  renderAlbums();
}


/* =====================================================
   CREATE ALBUM
===================================================== */

async function createAlbum(){

  const input =
    document.getElementById("albumName");

  const name =
    input.value.trim();

  if (!name){

    toast("Enter an album name");

    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("albums")
      .insert({
        user_id:currentUser.id,
        name:name
      });

  if (error){

    toast(error.message);

    return;
  }

  input.value = "";

  toast("Album created");

  await loadAlbums();

  closeAlbumModal();
}


/* =====================================================
   RENDER ALBUMS
===================================================== */

function renderAlbums(){

  const bar =
    document.getElementById("albumBar");

  let html = `
    <button
      class="album-chip ${activeAlbum === "all" ? "active":""}"
      onclick="selectAlbum('all')">
      All Photos
    </button>
  `;

  for (const album of albums){

    html += `
      <button
        class="album-chip ${activeAlbum === album.id ? "active":""}"
        onclick="selectAlbum('${album.id}')">
        📁 ${escapeHTML(album.name)}
      </button>
    `;
  }

  html += `
    <button
      class="album-chip"
      onclick="openAlbumModal()">
      ＋ Album
    </button>
  `;

  bar.innerHTML = html;

  document
    .getElementById("albumCount")
    .textContent =
      albums.length;
}


function selectAlbum(id){

  activeAlbum = id;

  renderAlbums();

  renderGallery();
}


/* =====================================================
   LOAD PHOTOS
===================================================== */

async function loadPhotos(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("photo_metadata")
      .select(`
        id,
        path,
        file_name,
        album_id,
        file_size,
        created_at
      `)
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending:false
      });

  if (error){

    console.error(error);

    toast("Could not load photos");

    return;
  }

  photos = data || [];

  for (const photo of photos){

    const {
      data:urlData
    } =
      await supabaseClient
        .storage
        .from("photos")
        .createSignedUrl(
          photo.path,
          3600
        );

    photo.url =
      urlData?.signedUrl || "";
  }

  renderGallery();

  updateStats();
}


/* =====================================================
   UPLOAD PHOTOS
===================================================== */

async function uploadPhotos(event){

  const files =
    Array.from(event.target.files || []);

  event.target.value = "";

  if (!files.length){
    return;
  }

  if (!currentUser){
    toast("Please login again");
    return;
  }

  const uploadList =
    document.getElementById("uploadList");

  uploadList.innerHTML = "";

  for (const file of files){

    const item =
      document.createElement("div");

    item.className =
      "upload-item";

    item.innerHTML = `
      <div>📷</div>
      <div class="upload-name">
        ${escapeHTML(file.name)}
      </div>
      <div class="upload-status">
        Uploading...
      </div>
    `;

    uploadList.appendChild(item);

    const status =
      item.querySelector(".upload-status");

    const safeName =
      file.name
        .replace(/[^a-zA-Z0-9._-]/g,"_");

    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "-" +
      safeName;

    const path =
      currentUser.id +
      "/" +
      fileName;

    const {
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from("photos")
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );

    if (uploadError){

      status.textContent =
        "Failed";

      toast(
        file.name +
        ": " +
        uploadError.message
      );

      continue;
    }

    const {
      error:dbError
    } =
      await supabaseClient
        .from("photo_metadata")
        .insert({
          user_id:currentUser.id,
          path:path,
          file_name:file.name,
          album_id:
            activeAlbum !== "all"
              ? activeAlbum
              : null,
          file_size:file.size
        });

    if (dbError){

      status.textContent =
        "Database error";

      toast(dbError.message);

      continue;
    }

    status.textContent =
      "Uploaded ✓";
  }

  toast(
    files.length +
    (files.length === 1
      ? " photo uploaded"
      : " photos uploaded")
  );

  await loadPhotos();

  setTimeout(() => {
    uploadList.innerHTML = "";
  },2500);
}


/* =====================================================
   RENDER GALLERY
===================================================== */

function renderGallery(){

  const gallery =
    document.getElementById("gallery");

  let result =
    [...photos];

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if (activeAlbum !== "all"){

    result =
      result.filter(
        p => p.album_id === activeAlbum
      );
  }

  if (search){

    result =
      result.filter(
        p =>
          p.file_name
            .toLowerCase()
            .includes(search)
      );
  }

  const sort =
    document
      .getElementById("sortSelect")
      .value;

  if (sort === "newest"){

    result.sort(
      (a,b) =>
        new Date(b.created_at) -
        new Date(a.created_at)
    );

  }else if(sort === "oldest"){

    result.sort(
      (a,b) =>
        new Date(a.created_at) -
        new Date(b.created_at)
    );

  }else if(sort === "az"){

    result.sort(
      (a,b) =>
        a.file_name
          .localeCompare(b.file_name)
    );

  }else if(sort === "za"){

    result.sort(
      (a,b) =>
        b.file_name
          .localeCompare(a.file_name)
    );
  }

  if (!result.length){

    gallery.innerHTML = `
      <div class="empty"
           style="grid-column:1/-1">

        <div class="empty-icon">🖼️</div>

        <div>No photos found</div>

        <div style="font-size:12px;margin-top:5px">
          Upload some photos to get started.
        </div>

      </div>
    `;

    return;
  }

  gallery.innerHTML =
    result.map(
      (photo,index) => `

      <div class="photo">

        <img
          src="${photo.url}"
          alt="${escapeHTML(photo.file_name)}"
          loading="lazy"
          onclick="openViewer('${photo.id}')">

        <div class="photo-actions">

          <button
            title="Download"
            onclick="event.stopPropagation();downloadPhoto('${photo.id}')">
            ↓
          </button>

          <button
            title="Delete"
            onclick="event.stopPropagation();deletePhoto('${photo.id}')">
            🗑
          </button>

        </div>

      </div>
    `
    ).join("");
}


/* =====================================================
   DELETE PHOTO
===================================================== */

async function deletePhoto(id){

  const photo =
    photos.find(
      p => p.id === id
    );

  if (!photo){
    return;
  }

  const confirmed =
    confirm(
      "Delete this photo permanently?"
    );

  if (!confirmed){
    return;
  }

  const {
    error:storageError
  } =
    await supabaseClient
      .storage
      .from("photos")
      .remove([
        photo.path
      ]);

  if (storageError){

    toast(
      "Storage delete failed: " +
      storageError.message
    );

    return;
  }

  const {
    error:dbError
  } =
    await supabaseClient
      .from("photo_metadata")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if (dbError){

    toast(dbError.message);

    return;
  }

  toast("Photo deleted");

  await loadPhotos();
}


/* =====================================================
   DOWNLOAD
===================================================== */

async function downloadPhoto(id){

  const photo =
    photos.find(
      p => p.id === id
    );

  if (!photo){
    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("photos")
        .download(photo.path);

    if (error){
      throw error;
    }

    const url =
      URL.createObjectURL(data);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      photo.file_name;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    toast("Download started");

  }catch(error){

    toast(error.message);
  }
}


/* =====================================================
   VIEWER
===================================================== */

function openViewer(id){

  const photo =
    photos.find(
      p => p.id === id
    );

  if (!photo){
    return;
  }

  currentViewerPhoto =
    photo;

  zoomLevel = 1;

  const image =
    document.getElementById("viewerImage");

  image.src =
    photo.url;

  image.style.transform =
    "scale(1)";

  document
    .getElementById("viewerTitle")
    .textContent =
      photo.file_name;

  document
    .getElementById("viewer")
    .classList.add("show");
}


function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("show");

  currentViewerPhoto = null;
}


function zoomIn(){

  zoomLevel =
    Math.min(
      zoomLevel + .25,
      4
    );

  updateZoom();
}


function zoomOut(){

  zoomLevel =
    Math.max(
      zoomLevel - .25,
      .5
    );

  updateZoom();
}


function resetZoom(){

  zoomLevel = 1;

  updateZoom();
}


function updateZoom(){

  document
    .getElementById("viewerImage")
    .style.transform =
      `scale(${zoomLevel})`;
}


function downloadCurrent(){

  if (currentViewerPhoto){
    downloadPhoto(
      currentViewerPhoto.id
    );
  }
}


/* =====================================================
   ALBUM MODAL
===================================================== */

function openAlbumModal(){

  document
    .getElementById("albumModal")
    .classList.add("show");

  renderAlbumModal();
}


function closeAlbumModal(){

  document
    .getElementById("albumModal")
    .classList.remove("show");
}


function renderAlbumModal(){

  const list =
    document
      .getElementById("albumModalList");

  if (!albums.length){

    list.innerHTML =
      `<div style="color:var(--muted)">
        No albums yet.
      </div>`;

    return;
  }

  list.innerHTML =
    albums.map(
      album => `

      <div class="profile-row">

        <div>
          📁 ${escapeHTML(album.name)}
        </div>

        <button
          class="secondary-btn"
          onclick="deleteAlbum('${album.id}')">
          Delete
        </button>

      </div>
    `
    ).join("");
}


async function deleteAlbum(id){

  const confirmed =
    confirm(
      "Delete this album? Photos will not be deleted."
    );

  if (!confirmed){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("albums")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);

  if (error){

    toast(error.message);

    return;
  }

  if (activeAlbum === id){
    activeAlbum = "all";
  }

  toast("Album deleted");

  await loadAlbums();

  await loadPhotos();

  renderAlbumModal();
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total =
    photos.reduce(
      (sum,p) =>
        sum +
        Number(p.file_size || 0),
      0
    );

  document
    .getElementById("photoCount")
    .textContent =
      photos.length;

  document
    .getElementById("storageUsed")
    .textContent =
      formatBytes(total);

  document
    .getElementById("profilePhotos")
    .textContent =
      photos.length;

  document
    .getElementById("profileStorage")
    .textContent =
      formatBytes(total);
}


/* =====================================================
   PROFILE
===================================================== */

function openProfile(){

  const panel =
    document
      .getElementById("profilePanel");

  panel.classList.toggle("hidden");

  if (!panel.classList.contains("hidden")){

    panel.scrollIntoView({
      behavior:"smooth"
    });
  }
}


/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

  document
    .body
    .classList
    .toggle("light");

  const mode =
    document.body.classList.contains("light")
      ? "light"
      : "dark";

  localStorage.setItem(
    "vault-theme",
    mode
  );
}


function loadTheme(){

  const mode =
    localStorage.getItem(
      "vault-theme"
    );

  if (mode === "light"){

    document
      .body
      .classList
      .add("light");
  }
}


/* =====================================================
   AUTO LOGOUT
===================================================== */

function resetInactivityTimer(){

  clearTimeout(
    inactivityTimer
  );

  if (!currentUser){
    return;
  }

  inactivityTimer =
    setTimeout(
      async () => {

        toast(
          "Logged out due to inactivity."
        );

        await logout();

      },
      AUTO_LOGOUT_MS
    );
}


[
  "click",
  "touchstart",
  "keydown",
  "scroll"
].forEach(
  eventName => {

    document.addEventListener(
      eventName,
      () => {

        if (currentUser){
          resetInactivityTimer();
        }

      },
      {
        passive:true
      }
    );
  }
);


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "Escape"){

      closeViewer();

      closeAlbumModal();
    }

  }
);


/* =====================================================
   CLICK OUTSIDE MODALS
===================================================== */

document
  .getElementById("viewer")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id === "viewer"
      ){
        closeViewer();
      }

    }
  );


document
  .getElementById("albumModal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id === "albumModal"
      ){
        closeAlbumModal();
      }

    }
  );


/* =====================================================
   SUPABASE AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (
      event === "SIGNED_OUT"
    ){

      currentUser = null;

      document
        .getElementById("app")
        .classList
        .add("hidden");

      document
        .getElementById("authScreen")
        .classList
        .remove("hidden");

    }

  }
);


/* =====================================================
   START
===================================================== */

loadTheme();

checkSession();

</script>
