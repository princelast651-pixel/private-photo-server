<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Photos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 25px 0;
    }

    h1 {
      text-align: center;
    }

    #loginPage {
      max-width: 380px;
      margin: 100px auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .logout {
      background: #dc2626;
      max-width: 150px;
      display: block;
      margin: 15px auto;
    }

    .upload {
      background: #16a34a;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    #galleryPage {
      display: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 25px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #222;
    }

    #fileInput {
      display: none;
    }

    .empty {
      text-align: center;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage">
    <h1>🔒 Private Photos</h1>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="message"></div>
  </div>


  <!-- PRIVATE GALLERY -->
  <div id="galleryPage">

    <div class="container">

      <h1>📸 My Photos</h1>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        onchange="uploadPhotos()"
      >

      <button class="upload" onclick="document.getElementById('fileInput').click()">
        📤 Upload Photos
      </button>

      <button onclick="loadPhotos()">
        🔄 Refresh Gallery
      </button>

      <div id="uploadMessage"></div>

      <div id="gallery" class="gallery"></div>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://woyvvkyckiwougcqvgno.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_GiAZ68Ta1ypJwyqxi_m3GA_lnVUVK5W";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // LOGIN
    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      if (!email || !password) {
        message.textContent =
          "Enter email and password.";
        return;
      }

      message.textContent =
        "Logging in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent =
          error.message;
        return;
      }

      showGallery();
    }


    // SHOW GALLERY
    function showGallery() {

      document.getElementById("loginPage")
        .style.display = "none";

      document.getElementById("galleryPage")
        .style.display = "block";

      loadPhotos();
    }


    // UPLOAD
    async function uploadPhotos() {

      const files =
        document.getElementById("fileInput").files;

      const message =
        document.getElementById("uploadMessage");

      if (!files.length) return;

      message.textContent =
        "Uploading...";

      for (const file of files) {

        const fileName =
          Date.now() + "-" +
          Math.random().toString(36).substring(2) +
          "-" +
          file.name;

        const { error } =
          await supabaseClient.storage
            .from("photos")
            .upload(fileName, file);

        if (error) {
          message.textContent =
            "Upload error: " + error.message;
          return;
        }
      }

      message.textContent =
        "Photos uploaded successfully!";

      document.getElementById("fileInput").value = "";

      loadPhotos();
    }


    // LOAD PHOTOS
    async function loadPhotos() {

      const gallery =
        document.getElementById("gallery");

      gallery.innerHTML =
        '<p class="empty">Loading photos...</p>';

      const { data, error } =
        await supabaseClient.storage
          .from("photos")
          .list("", {
            limit: 100,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          });

      if (error) {
        gallery.innerHTML =
          '<p class="empty">Could not load photos.</p>';
        return;
      }

      if (!data || data.length === 0) {
        gallery.innerHTML =
          '<p class="empty">No photos yet.</p>';
        return;
      }

      gallery.innerHTML = "";

      for (const file of data) {

        const { data: signedData, error } =
          await supabaseClient.storage
            .from("photos")
            .createSignedUrl(file.name, 3600);

        if (error) continue;

        const img =
          document.createElement("img");

        img.src = signedData.signedUrl;
        img.className = "photo";

        gallery.appendChild(img);
      }
    }


    // LOGOUT
    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("galleryPage")
        .style.display = "none";

      document.getElementById("loginPage")
        .style.display = "block";

      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
    }


    // CHECK EXISTING LOGIN
    async function checkLogin() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        showGallery();
      }
    }

    checkLogin();

  </script>

</body>
</html>
