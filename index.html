<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Photo Server</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 380px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 15px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    #privatePage {
      display: none;
      text-align: center;
    }

    .logout {
      background: #dc2626;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- LOGIN PAGE -->
    <div id="loginPage">
      <h1>Private Photos</h1>

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="login()">Login</button>

      <div id="message"></div>
    </div>

    <!-- PRIVATE PAGE -->
    <div id="privatePage">
      <h1>Welcome 🔒</h1>
      <p>You are logged in.</p>
      <p>Your private photos will appear here.</p>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://woyvvkyckiwougcqvgno.supabase.co";

    const SUPABASE_KEY = "sb_publishable_GiAZ68Ta1ypJwyqxi_m3GA_lnVUVK5W";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Enter email and password.";
        return;
      }

      message.textContent = "Logging in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        return;
      }

      showPrivatePage();
    }

    function showPrivatePage() {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("privatePage").style.display = "block";
    }

    async function logout() {
      await supabaseClient.auth.signOut();

      document.getElementById("privatePage").style.display = "none";
      document.getElementById("loginPage").style.display = "block";
      document.getElementById("message").textContent = "";
    }

    async function checkLogin() {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        showPrivatePage();
      }
    }

    checkLogin();
  </script>

</body>
</html>
